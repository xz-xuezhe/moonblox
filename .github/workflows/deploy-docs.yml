name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'cmd/moonblox/**'
      - 'theme/**'
      - 'ast/**'
      - 'convert/**'
      - 'parser/**'
      - 'render/**'
      - 'cmd/moonblox/templates/**'
      - 'moon.mod'
      - 'moon.work'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Moon version
        run: |
          moon version --all
          moonrun --version

      - name: Update dependencies
        run: moon update

      - name: Build MoonBlox CLI
        run: moon build --target native

      - name: Scaffold docs site (headless)
        run: |
          MOONBLOX_PATH="$GITHUB_WORKSPACE" \
          _build/native/debug/build/xz-xuezhe/moonblox-cli/moonblox-cli.exe init _docs_site --headless --theme docs --empty --quiet

      - name: Copy docs content
        run: |
          cp -R docs/. _docs_site/docs/

      - name: Build docs site
        run: |
          MOONBLOX_PATH="$GITHUB_WORKSPACE" \
          _build/native/debug/build/xz-xuezhe/moonblox-cli/moonblox-cli.exe build _docs_site

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _docs_site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
